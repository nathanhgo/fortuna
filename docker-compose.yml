services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fortuna}
      POSTGRES_USER: ${POSTGRES_USER:-fortuna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fortuna}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fortuna}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro da rede do compose, o Postgres é acessado pelo nome do serviço, não por
      # "localhost" — sobrescreve o que estiver no .env (que serve para quem roda sem Docker).
      POSTGRES_HOST: postgres
    ports:
      - '8000:8000'
      - '5678:5678' # debugpy, só é usado se DJANGO_DEBUGPY=1 (ver .env.example)
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '3000:3000'
      - '9229:9229' # inspector do Node, só é usado se NODE_DEBUGGER=1 (ver .env.example)
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    depends_on:
      - backend

volumes:
  postgres-data:
  frontend-node-modules:
  frontend-next-cache:
