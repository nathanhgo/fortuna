# Use este arquivo se o Root Directory do serviço no Render for `backend`.
# No monorepo, o blueprint canônico é /render.yaml (com rootDir: backend).
# Daphne (ASGI) — gunicorn WSGI não serve o WebSocket em /ws/.

services:
  - type: web
    name: fortuna-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
